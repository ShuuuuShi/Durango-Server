# ============================================================================
# Nginx Config สำหรับเสิร์ฟ Durango Asset Bundles
# ============================================================================
#
# วิธีใช้บน VPS:
#   1. mkdir -p /opt/durango/AssetBundles-android
#   2. scp -r "C:\Users\thana\Desktop\Durango Android\AssetBundles-android\*" \
#        root@your-vps:/opt/durango/AssetBundles-android/
#   3. scp nginx-bundles.conf root@your-vps:/etc/nginx/sites-available/durango
#   4. ssh root@your-vps
#   5. ln -sf /etc/nginx/sites-available/durango /etc/nginx/sites-enabled/durango
#   6. rm -f /etc/nginx/sites-enabled/default
#   7. nginx -t
#   8. systemctl reload nginx
#
# โครงสร้างไฟล์บน VPS:
#   /opt/durango/AssetBundles-android/    ← โฟลเดอร์ bundle ชุด Android
#   /opt/durango/AssetBundles/            ← โฟลเดอร์ bundle ชุด Windows (PC) ถ้ามี
#
# หมายเหตุ: ชื่อไฟล์ bundle มี hash อยู่แล้ว (เช่น xxx.abc123.bundle)
#   ⇒ เปลี่ยนเนื้อหา = เปลี่ยนชื่อ → cache ได้ตลอดกาลปลอดภัย
# ============================================================================

# --- Rate limiting zone: กันคนเดียวโหลดรัวเกินไป ---
limit_req_zone $binary_remote_addr zone=bundle_limit:10m rate=10r/s;

# --- Connection limiting zone ---
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    # listen 443 ssl http2;   # ← เปิดถ้ามี SSL cert (Cloudflare จัดการ SSL ให้ ไม่ต้องเปิด)

    server_name your-domain.com;  # ← เปลี่ยนเป็น domain จริง

    # --- ข้อจำกัดทั่วไป ---
    client_max_body_size 0;       # ไม่จำกัด size (bundle ไฟล์ใหญ่สุด ~34MB)

    # ===============================================================
    # Android Asset Bundles — ทุกอย่างอยู่ path นี้หมด
    # Client จริงยิงมา: /assetbundles/android/<filename>.bundle
    # Index JSON:       /assetbundles/android/Info.android.5.2.1.json
    # ===============================================================
    location /assetbundles/android/ {
        alias /opt/durango/AssetBundles-android/;

        # --- Cache Headers ---
        # ชื่อไฟล์มี hash+CRC อยู่แล้ว ⇒ cache ได้ตลอดกาล
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # --- Compression ---
        gzip on;
        gzip_types application/octet-stream;
        gzip_min_length 1024;

        # --- Performance ---
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;

        # --- Rate limiting ---
        # 限 10 req/s/IP, burst 20 ( allow 20 ในชั่วพริบตา แล้วค่อยๆ drain)
        limit_req zone=bundle_limit burst=20 nodelay;
        limit_conn conn_limit 10;  # สูงสุด 10 connections ต่อ IP

        # --- Logging ---
        access_log /var/log/nginx/durango-bundles.log;
        error_log /var/log/nginx/durango-bundles-error.log;
    }

    # ===============================================================
    # Windows/PC Asset Bundles
    # ===============================================================
    location /assetbundles/ {
        alias /opt/durango/AssetBundles/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        gzip on;
        gzip_types application/octet-stream;
        gzip_min_length 1024;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;

        limit_req zone=bundle_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        access_log /var/log/nginx/durango-bundles.log;
        error_log /var/log/nginx/durango-bundles-error.log;
    }

    # ===============================================================
    # Fallback: ตอบ 404 สำหรับ request อื่นๆ
    # ===============================================================
    location / {
        return 404 "Not Found\n";
    }

    # --- Gzip ทั่วไป ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
}
