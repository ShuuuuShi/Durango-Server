<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>DinoWorld Launcher</title>
<style>
  :root{
    --bg0:#07070b; --bg1:#0d0d14;
    --panel:#14141d; --panel2:#1a1a26;
    --line:#2b2233;
    --pink:#ff2e7e; --pink-dk:#c2185b; --pink-deep:#7d0f40;
    --pink-soft:#ff7ab0; --pink-glow:#ff2e7e66;
    --text:#f4e8ef; --dim:#a08ba0;
    --ok:#ff2e7e; --warn:#ffb347; --err:#ff5566;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:"Segoe UI","Leelawadee UI",Tahoma,sans-serif;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:linear-gradient(180deg,#0b0b11 0%,#060609 100%);
    color:var(--text);
    display:flex; flex-direction:column;
    user-select:none;
  }

  /* ---------- launcher window (frameless — titlebar วาดเอง) ---------- */
  .launcher{
    width:100%; height:100%;
    background:linear-gradient(180deg,#15151f 0%,#0c0c12 100%);
    outline:1px solid var(--pink-deep);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .titlebar{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:linear-gradient(180deg,#1c1622,#120d18);
    border-bottom:1px solid var(--pink-deep);
    -webkit-app-region:drag;
  }
  .logo{display:flex; align-items:center;}
  .gamename{
    font-size:19px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(180deg,#ff7ab0,#ff2e7e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px #ff2e7e44);
  }
  .gamename small{font-size:11px; color:var(--dim); font-weight:400; margin-left:8px; letter-spacing:.5px; -webkit-text-fill-color:var(--dim);}
  .winbtns{margin-left:auto; display:flex; gap:6px; -webkit-app-region:no-drag;}
  .winbtns .wb{
    width:26px;height:24px;border-radius:5px;border:1px solid #3a2a36;
    background:#00000045;color:var(--dim);cursor:pointer;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .winbtns .wb.close{background:#7d0f40;border-color:var(--pink-deep);color:#ffd6e8;}
  .winbtns .wb:hover{filter:brightness(1.35);}

  .main{flex:1; display:flex; gap:12px; padding:12px; min-height:0;}

  /* ---------- news panel ---------- */
  .news{
    flex:1.25; background:linear-gradient(180deg,#12121acc,#0d0d13ee);
    border:1px solid var(--line); border-radius:8px; box-shadow:inset 0 0 30px #00000090;
    display:flex; flex-direction:column; min-width:0;
  }
  .news-tabs{display:flex; gap:4px; padding:8px 8px 0;}
  .ntab{
    padding:6px 16px; font-size:13px; cursor:pointer; border-radius:6px 6px 0 0;
    background:#00000035; border:1px solid transparent; border-bottom:none; color:var(--dim);
  }
  .ntab:hover{color:var(--pink-soft);}
  .ntab.on{
    background:linear-gradient(180deg,#241222,#181019);
    color:var(--pink-soft); font-weight:700; border-color:var(--pink-deep);
    box-shadow:inset 0 2px 0 var(--pink);
  }
  .news-list{flex:1; overflow-y:auto; padding:8px 10px 10px;}
  .news-list::-webkit-scrollbar{width:8px;}
  .news-list::-webkit-scrollbar-thumb{background:#7d0f4088; border-radius:99px;}
  .news-item{
    padding:9px 10px; border-radius:6px; margin-bottom:6px; cursor:pointer;
    background:#ffffff06; border:1px solid #ffffff0d; transition:.12s;
  }
  .news-item:hover{background:#ff2e7e0d; border-color:#ff2e7e44; box-shadow:0 0 12px #ff2e7e14;}
  .news-item .nhead{display:flex; align-items:center; gap:8px;}
  .badge{font-size:10px; font-weight:800; padding:2px 8px; border-radius:99px; white-space:nowrap;}
  .b-news{background:#7d0f4055; color:#ffb1cf; border:1px solid var(--pink);}
  .b-update{background:#4a124055; color:#e2a8ff; border:1px solid #b04fd6;}
  .b-event{background:#7d2f0f55; color:#ffc9a8; border:1px solid #ff7a45;}
  .news-item .ntitle{font-size:13px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .news-item .ndate{font-size:11px; color:var(--dim);}
  .news-item .nbody{
    display:none; font-size:12px; color:var(--dim); line-height:1.65;
    margin-top:7px; padding-top:7px; border-top:1px dashed #ffffff1c;
  }
  .news-item.open .nbody{display:block;}

  /* ---------- side column ---------- */
  .side{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0;}
  .slider{
    position:relative; flex:1; border-radius:8px; overflow:hidden;
    border:1px solid var(--line); cursor:pointer; min-height:140px;
    box-shadow:inset 0 0 40px #000000aa;
  }
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    opacity:0; transition:opacity .5s;
  }
  .slide.on{opacity:1;}
  .slide .big{font-size:52px; filter:drop-shadow(0 0 18px #ff2e7e55); line-height:1;}
  .slide .cap{font-size:14px; font-weight:700; color:#ffe4f0; text-shadow:0 2px 6px #000;}
  .slide .sub{font-size:11px; color:var(--dim);}
  .s1{background:radial-gradient(circle at 70% 25%, #ff2e7e33 0%, transparent 55%), linear-gradient(160deg,#220d1c,#0d0710);}
  .s2{background:radial-gradient(circle at 30% 75%, #b04fd62e 0%, transparent 55%), linear-gradient(160deg,#170d22,#0a0710);}
  .s3{background:radial-gradient(circle at 60% 30%, #ff7ab026 0%, transparent 55%), linear-gradient(160deg,#1c0f16,#0b070c);}
  .slider .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px;height:28px; border-radius:50%; border:1px solid var(--pink-deep); cursor:pointer;
    background:#00000077; color:#ffb1cf; font-size:14px; z-index:2;
  }
  .slider .arrow:hover{background:#7d0f4088;}
  .arrow.l{left:8px;} .arrow.r{right:8px;}
  .dots{position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:2;}
  .dot{width:8px;height:8px;border-radius:50%;background:#ffffff2a;cursor:pointer;}
  .dot.on{background:var(--pink); box-shadow:0 0 8px var(--pink-glow);}

  .status-card{
    background:linear-gradient(180deg,#131320cc,#0e0e15ee);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    box-shadow:inset 0 0 30px #00000090;
    display:flex; flex-direction:column; gap:8px; font-size:13px;
  }
  .st-row{display:flex; justify-content:space-between; align-items:center;}
  .st-label{color:var(--dim); font-size:12px;}
  .srv-name{font-weight:700; font-size:14px; color:#ffe4f0;}
  .dot-live{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--pink); box-shadow:0 0 8px var(--pink); animation:blink 2s infinite;}
  .dot-dead{background:#553344; box-shadow:none; animation:none;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.45;}}
  .pill{padding:2px 10px; border-radius:99px; font-size:11px; font-weight:700; border:1px solid;}
  .p-online{color:#b5dd8f; border-color:#5c7a34; background:#5c7a3422;}
  .p-offline{color:#f0b0a0; border-color:#a0442f; background:#a0442f22;}
  .players-bar{height:8px; background:#00000066; border-radius:99px; overflow:hidden; border:1px solid #00000088;}
  .players-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--pink-deep),var(--pink)); box-shadow:0 0 8px var(--pink-glow); border-radius:99px; transition:width .6s;}
  .addr{font-size:11px; color:var(--pink-soft); word-break:break-all;}

  /* ---------- bottom bar ---------- */
  .bottom{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:linear-gradient(180deg,#17101c,#0e0a12);
    border-top:1px solid var(--pink-deep);
  }
  .lbtn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;
    background:linear-gradient(180deg,#231722,#150e17);
    border:1px solid var(--pink-deep); color:#e8ccd9;
    box-shadow:inset 0 1px 0 #ffffff0d;
  }
  .lbtn:hover{filter:brightness(1.3); border-color:var(--pink);}
  .progress-wrap{flex:1; min-width:120px;}
  .progress-text{font-size:11px; color:var(--dim); margin-bottom:4px; display:flex; justify-content:space-between;}
  .progress{height:12px; background:#00000066; border-radius:99px; overflow:hidden; border:1px solid #00000099;}
  .progress i{
    display:block; height:100%; width:0%;
    background:repeating-linear-gradient(45deg,var(--pink) 0 12px,var(--pink-dk) 12px 24px);
    box-shadow:0 0 12px var(--pink-glow);
    animation:crawl 1s linear infinite; transition:width .2s;
  }
  @keyframes crawl{to{background-position:-34px 0;}}
  .ver{font-size:11px; color:var(--dim); text-align:right; line-height:1.4;}
  .play{
    min-width:170px; padding:14px 26px; border-radius:8px; border:1px solid #ff5c98;
    background:linear-gradient(180deg,#ff4d92,#a81353);
    color:#fff; font-size:18px; font-weight:800; cursor:pointer; letter-spacing:1px;
    text-shadow:0 2px 0 #00000055;
    box-shadow:0 4px 0 #5c0a2e, 0 8px 22px #ff2e7e44, inset 0 1px 0 #ffffff55;
    transition:.12s;
  }
  .play:hover:not(:disabled){filter:brightness(1.12); transform:translateY(-1px);}
  .play:active:not(:disabled){transform:translateY(2px); box-shadow:0 2px 0 #5c0a2e;}
  .play:disabled{filter:grayscale(.35) brightness(.7); cursor:wait;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  /* ---------- modal & toast (เหมือน mockup ทุกอย่าง) ---------- */
  .overlay{
    position:fixed; inset:0; background:#050308bb; backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    width:min(460px,92vw); background:linear-gradient(180deg,#181220,#0f0b13);
    border:1px solid var(--pink-deep); border-radius:10px;
    box-shadow:0 0 0 1px #000, 0 18px 60px #000000ee, 0 0 40px #ff2e7e1e;
  }
  .modal h3{
    padding:12px 16px; font-size:15px; color:var(--pink-soft);
    background:linear-gradient(180deg,#221526,#150e19);
    border-bottom:1px solid var(--pink-deep); border-radius:9px 9px 0 0;
  }
  .modal .mbody{padding:16px; font-size:13px; line-height:1.7; max-height:340px; overflow-y:auto;}
  .modal .mfoot{padding:12px 16px; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid #ffffff0d;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:5px;}
  .field input[type=text]{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid #3a2a36;
    background:#00000055; color:var(--text); font-size:13px; outline:none;
  }
  .field input:focus{border-color:var(--pink); box-shadow:0 0 8px #ff2e7e33;}
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0;}
  .switch{position:relative; width:42px; height:22px; cursor:pointer; flex:none;}
  .switch input{display:none;}
  .switch .track{position:absolute; inset:0; border-radius:99px; background:#00000066; border:1px solid #3a2a36; transition:.15s;}
  .switch .track::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#6b5566; transition:.15s;}
  .switch input:checked + .track{background:var(--pink-deep); border-color:var(--pink); box-shadow:0 0 10px #ff2e7e33;}
  .switch input:checked + .track::after{left:22px; background:#ffd6e8;}

  #toasts{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:99;}
  .toast{
    min-width:230px; max-width:360px; padding:10px 14px; border-radius:8px; font-size:13px;
    background:linear-gradient(180deg,#1a1220,#100b14); border:1px solid var(--line);
    box-shadow:0 8px 24px #000000cc; animation:tin .25s;
    display:flex; gap:8px; align-items:flex-start; line-height:1.5;
  }
  @keyframes tin{from{opacity:0; transform:translateY(10px);}to{opacity:1;}}
  .toast.ok{border-color:var(--pink); box-shadow:0 8px 24px #000000cc, 0 0 16px #ff2e7e22;}
  .toast.err{border-color:var(--err);} .toast.info{border-color:#b04fd6;}
</style>
</head>
<body>

<div class="launcher">
  <div class="titlebar">
    <span class="logo" id="logoSlot"></span>
    <span class="gamename">DINOWORLD<small>Launcher</small></span>
    <div class="winbtns">
      <button class="wb" onclick="window.launcher.minimize()">–</button>
      <button class="wb close" onclick="window.launcher.close()">✕</button>
    </div>
  </div>

  <div class="main">
    <div class="news">
      <div class="news-tabs" id="newsTabs"></div>
      <div class="news-list" id="newsList"></div>
    </div>

    <div class="side">
      <div class="slider" id="slider">
        <button class="arrow l" onclick="slide(-1,event)">‹</button>
        <button class="arrow r" onclick="slide(1,event)">›</button>
        <div class="dots" id="dots"></div>
      </div>
      <div class="status-card">
        <div class="st-row">
          <span class="srv-name"><span class="dot-live" id="srvDot"></span><span id="srvName">DinoWorld</span></span>
          <span class="pill p-online" id="srvPill" style="color:#ffb1cf;">กำลังเชื่อมต่อ…</span>
        </div>
        <div class="st-row"><span class="st-label">ผู้เล่น</span><span id="srvPlayers">—</span></div>
        <div class="players-bar"><i id="playersFill" style="width:0%"></i></div>
        <div class="st-row"><span class="st-label">Ping</span><span id="srvPing">—</span></div>
        <div class="st-row"><span class="st-label">เวอร์ชันล่าสุด</span><span id="srvVer">—</span></div>
        <hr style="border:none;border-top:1px solid #ffffff10;">
        <div class="st-row"><span class="st-label">เซิร์ฟเวอร์</span><span class="addr" id="cfgAddr">—</span></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="lbtn" onclick="window.launcher.openMapEditor()">🗺️ Map Editor</button>
    <button class="lbtn" onclick="openSettings()">⚙️ ตั้งค่า</button>
    <button class="lbtn" onclick="repairFiles()">🔧 ซ่อมไฟล์</button>
    <div class="progress-wrap">
      <div class="progress-text"><span id="progLabel">พร้อมเล่น</span><span id="progPct"></span></div>
      <div class="progress"><i id="progFill"></i></div>
    </div>
    <div class="ver">ติดตั้ง <b id="localVer">—</b><br><span id="needUpdate" style="color:var(--pink-soft);"></span></div>
    <button class="play" id="playBtn" onclick="onPlay()">▶ เข้าเกม</button>
  </div>
</div>

<!-- Modal: ตั้งค่า -->
<div class="overlay" id="ovSettings">
  <div class="modal">
    <h3>⚙️ ตั้งค่า Launcher</h3>
    <div class="mbody">
      <div class="field">
        <label>ที่อยู่เซิร์ฟเวอร์ (ip:port — ไม่ใส่พอร์ต = 8190)</label>
        <input type="text" id="setAddr" placeholder="127.0.0.1:8190">
      </div>
      <div class="switch-row">
        <span>อัปเดตเกมอัตโนมัติก่อนเข้าเล่น</span>
        <label class="switch"><input type="checkbox" id="setAutoPatch" checked><span class="track"></span></label>
      </div>
    </div>
    <div class="mfoot">
      <button class="lbtn" onclick="closeModal('ovSettings')">ยกเลิก</button>
      <button class="lbtn" style="background:linear-gradient(180deg,#a81353,#7d0f40);border-color:var(--pink);" onclick="saveSettings()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: ยืนยันอัปเดต -->
<div class="overlay" id="ovConfirm">
  <div class="modal">
    <h3 id="confirmTitle">📦 พบอัปเดตใหม่</h3>
    <div class="mbody" id="confirmBody"></div>
    <div class="mfoot">
      <button class="lbtn" onclick="closeModal('ovConfirm'); setBusy(false)">ยกเลิก</button>
      <button class="lbtn" style="background:linear-gradient(180deg,#a81353,#7d0f40);border-color:var(--pink);" onclick="confirmUpdate()">⬇️ อัปเดตเลย</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
/* ================= ผีเสื้อ 8-bit (เหมือน mockup) ================= */
const BUTTERFLY_MAP = [
  "...K....K...",
  ".AAA....AAA.",
  "AAHAA..AAHAA",
  "AHAB....BAHA",
  ".ABKKKKKKBA.",
  "..BKKKKKKB..",
  ".ABBKKKKBBA.",
  "AABBAKKABBAA",
  "AHB.AAA.BHA.",
  ".A..AAA..A..",
];
const BF_COLORS = {A:'#ff2e7e', B:'#a81353', H:'#ff9ec7', K:'#1c0913'};
function butterflySVG(px){
  let cells='';
  BUTTERFLY_MAP.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const c=row[x];
      if(c!=='.'&&BF_COLORS[c]) cells+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${BF_COLORS[c]}"/>`;
    }
  });
  return `<svg width="${px}" height="${px*10/12}" viewBox="0 0 12 ${BUTTERFLY_MAP.length}" shape-rendering="crispEdges">${cells}</svg>`;
}
document.getElementById('logoSlot').innerHTML=butterflySVG(28);

/* ================= state ================= */
const S = { server:'127.0.0.1:8190', autoPatch:true, online:false, busy:false,
            localVer:null, latestVer:null, patchManifest:null };

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
function toast(type,msg){
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML='<span>'+(type==='ok'?'✅':type==='err'?'⚠️':'ℹ️')+'</span><span>'+msg+'</span>';
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),4200);
}
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }));

function setProgress(pct,label){
  $('progFill').style.width=pct+'%';
  $('progPct').textContent = pct>0 ? Math.floor(pct)+'%' : '';
  if(label!==undefined) $('progLabel').textContent=label;
}
function setBusy(b,text='⏳ กำลังดำเนินการ…'){
  S.busy=b;
  $('playBtn').disabled=b;
  $('playBtn').textContent=b?text:'▶ เข้าเกม';
}
function hostOf(a){ return a.includes(':') ? a : a+':8190'; }

function refreshVersionUi(){
  $('localVer').textContent = S.localVer ?? 'ไม่ทราบ';
  if(S.latestVer){
    const need = S.localVer !== S.latestVer;
    $('needUpdate').textContent = need ? 'มีอัปเดตใหม่! ('+S.latestVer+')' : 'เป็นเวอร์ชันล่าสุด';
    $('needUpdate').style.color = need ? 'var(--pink-soft)' : '#8fdc9f';
  }
}

/* ================= init จาก main process ================= */
(async ()=>{
  const st = await window.launcher.getState();
  S.server = st.server || S.server;
  S.localVer = st.localVer;
  refreshVersionUi();
  renderStatus();
  await RefreshNewsAsync();
  await RefreshStatusAsync();
  setInterval(RefreshStatusAsync, 5000);

  // progress จาก patch (main → renderer)
  window.launcher.onPatchProgress((pct,label)=>setProgress(pct,label));
})();

/* ================= news ================= */
async function RefreshNewsAsync(){
  try{
    const r = await window.launcher.httpJson(`http://${hostOf(S.server)}/launcher/news`);
    if(!r.ok) throw new Error(r.error||'news unavailable');
    const o = r.data;
    renderTabs(); renderNews(o.items||[], 'all');
  }catch{
    renderTabs();
    renderNews([{cat:'news',date:'',title:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้',
                 body:'ไม่สามารถโหลดประกาศจาก '+S.server+' ได้\nยังกดเข้าเกมได้ปกติถ้าเซิร์ฟเปิดอยู่'}], 'all');
  }
}
const CATS=[['all','📰 ทั้งหมด'],['news','📢 ประกาศ'],['update','📦 อัปเดต'],['event','🎁 อีเวนต์']];
let curCat='all';
let NEWS_ITEMS=[];
function renderTabs(){
  $('newsTabs').innerHTML=CATS.map(([id,name])=>
    `<div class="ntab ${curCat===id?'on':''}" onclick="curCat='${id}';renderNews(NEWS_ITEMS,'${id}')">${name}</div>`).join('');
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');}
function renderNews(items,cat){
  NEWS_ITEMS=items;
  const list=items.filter(n=>cat==='all'||n.cat===cat);
  $('newsList').innerHTML=list.map(n=>`
    <div class="news-item" onclick="this.classList.toggle('open')">
      <div class="nhead">
        <span class="badge ${'b-'+(n.cat||'news')}">${n.cat==='news'?'ประกาศ':n.cat==='update'?'อัปเดต':'อีเวนต์'}</span>
        <span class="ntitle">${esc(n.title)}</span>
        <span class="ndate">${esc(n.date)}</span>
      </div>
      <div class="nbody">${esc(n.body)}</div>
    </div>`).join('');
}

/* ================= slider ================= */
const SLIDES=[
  {cls:'s1', svg:true, cap:'ยินดีต้อนรับสู่ DinoWorld', sub:'โลกไดโนเสาร์ของเราเอง'},
  {cls:'s2', icon:'🌋', cap:'อีเวนต์ภูเขาไฟระเบิด!', sub:'ไอเทมพิเศษตกราวสุดสัปดาห์'},
  {cls:'s3', icon:'🦕', cap:'ฤดูล่าใหญ่', sub:'EXP x2 ทุกกิจกรรม'},
];
let curSlide=0, slideTimer;
(function buildSlider(){
  $('slider').insertAdjacentHTML('afterbegin', SLIDES.map((s,i)=>`
    <div class="slide ${s.cls} ${i===0?'on':''}">
      <div class="big">${s.svg?butterflySVG(84):s.icon}</div><div class="cap">${s.cap}</div><div class="sub">${s.sub}</div>
    </div>`).join(''));
  $('dots').innerHTML=SLIDES.map((_,i)=>`<span class="dot ${i===0?'on':''}" onclick="goSlide(${i},event)"></span>`).join('');
  slideTimer=setInterval(()=>goSlide((curSlide+1)%SLIDES.length),4000);
})();
function goSlide(i,ev){
  if(ev) ev.stopPropagation();
  curSlide=(i+SLIDES.length)%SLIDES.length;
  document.querySelectorAll('.slide').forEach((el,j)=>el.classList.toggle('on',j===curSlide));
  document.querySelectorAll('.dot').forEach((el,j)=>el.classList.toggle('on',j===curSlide));
}
function slide(dir,ev){ ev.stopPropagation(); goSlide(curSlide+dir); clearInterval(slideTimer); slideTimer=setInterval(()=>goSlide(curSlide+1),4000); }

/* ================= สถานะเซิร์ฟ ================= */
let pingMs=null;
async function RefreshStatusAsync(){
  const base=`http://${hostOf(S.server)}`;
  let statusOk=false;
  try{
    // เซิร์ฟรุ่นใหม่มี /launcher/status
    const t0=performance.now();
    const r=await window.launcher.httpJson(`${base}/launcher/status`);
    pingMs=Math.round(performance.now()-t0);
    if(!r.ok) throw new Error(r.error||'launcher status unavailable');
    const o=r.data;
    statusOk=true;
    S.online=true;
    $('srvDot').className='dot-live';
    $('srvPill').className='pill p-online'; $('srvPill').textContent='🟢 ออนไลน์';
    $('srvName').textContent=o.name||'DinoWorld';
    $('srvPlayers').textContent=`${o.players} / ${o.max_players}`;
    $('playersFill').style.width=(o.max_players>0 ? o.players/o.max_players*100 : 0)+'%';
    $('srvPing').textContent=pingMs+' ms';
    if(o.latest_version){ S.latestVer=o.latest_version; }
  }catch{
    // backward compatibility: Linux server build เดิมยังไม่มี /launcher/* แต่ /knock ใช้งานได้
    try{
      const t0=performance.now();
      const knock=await window.launcher.httpJson(`${base}/knock`);
      pingMs=Math.round(performance.now()-t0);
      if(!knock.ok) throw new Error(knock.error||'knock unavailable');
      const o=knock.data;
      statusOk=true;
      S.online=true;
      $('srvDot').className='dot-live';
      $('srvPill').className='pill p-online'; $('srvPill').textContent='🟢 ออนไลน์';
      $('srvName').textContent='DinoWorld — '+(o.server_version||'เซิร์ฟเวอร์เก่า');
      $('srvPlayers').textContent='— / 10'; $('playersFill').style.width='0%';
      $('srvPing').textContent=pingMs+' ms';
      // server_version คือ protocol version ไม่ใช่ game patch version จึงไม่เอาไปเทียบอัปเดต
    }catch{
      statusOk=false;
      S.online=false;
      $('srvDot').className='dot-live dot-dead';
      $('srvPill').className='pill p-offline'; $('srvPill').textContent='🔴 ออฟไลน์';
      $('srvPlayers').textContent='—'; $('playersFill').style.width='0%'; $('srvPing').textContent='—';
    }
  }
  // manifest แพตช์ (จาก /launcher/version); build เก่าไม่มี route จึงข้ามเงียบ ๆ
  try{
    const versionRes=await window.launcher.httpJson(`${base}/launcher/version`);
    if(versionRes.ok){
      const v=versionRes.data;
      if(v.version && v.zip_url){ S.patchManifest={version:v.version, zip_url:v.zip_url, sha256:v.sha256, notes:v.notes}; S.latestVer=v.version; }
      else if(v.version){ S.latestVer=v.version; }
    }
  }catch{}
  $('cfgAddr').textContent=S.server;
  $('srvVer').textContent=S.latestVer||'—';
  refreshVersionUi();
}
function renderStatus(){ $('cfgAddr').textContent=S.server; }

/* ================= ปุ่มหลัก: เข้าเกม ================= */
async function onPlay(){
  if(S.busy) return;

  if(!await window.launcher.getState().then(s=>s.hasGame)){
    toast('err','ไม่พบ DurangoV2.exe — ต้องวาง Launcher ไว้ในโฟลเดอร์เกม (ข้างๆ DurangoV2.exe)');
    return;
  }

  // อัปเดตก่อนเข้า (ถ้าต้องอัปเดต)
  if(S.patchManifest && S.localVer!==null && S.patchManifest.version!==S.localVer && S.autoPatch && !S.busy){
    openConfirm(); return;
  }
  doLaunch();
}

function openConfirm(){
  $('confirmTitle').textContent='📦 พบอัปเดตใหม่ '+S.patchManifest.version;
  $('confirmBody').innerHTML=
    `เวอร์ชันปัจจุบัน <b>${S.localVer??'ไม่ทราบ'}</b> → ใหม่ <b>${S.patchManifest.version}</b><br>`+
    `<span style="font-size:12px;color:var(--dim);">${esc(S.patchManifest.notes||'')}<br><br>โหลด→ตรวจ SHA256→แตก temp ก่อนเสมอ ถ้าพลาดไฟล์เกมเดิมยังอยู่ครบ</span>`;
  openModal('ovConfirm');
}
async function confirmUpdate(){
  closeModal('ovConfirm');
  setBusy(true,'⏳ กำลังอัปเดต…');
  const r = await window.launcher.patchGame(S.patchManifest);
  setBusy(false);
  if(r.ok){
    S.localVer=r.version; refreshVersionUi();
    toast('ok','อัปเดตเป็น '+r.version+' เรียบร้อย 🎉');
  }else{
    toast('err','อัปเดตไม่สำเร็จ: '+r.error+' (เข้าเกมเวอร์ชันเดิมได้)');
  }
  doLaunch();
}

async function doLaunch(){
  setBusy(true,'🎮 กำลังเปิดเกม…');
  const host=hostOf(S.server);
  toast('info','กำลังเปิด DurangoV2.exe … DURANGO_AUTOCONNECT='+host);
  const r = await window.launcher.launchGame(S.server);
  setProgress(0,'พร้อมเล่น');
  setBusy(false);
  if(r.ok){
    toast('ok','เปิดเกมแล้ว — ขอให้สนุก! 🦋');
    setTimeout(()=>window.launcher.close(), 1200);   // ปิด launcher หลังเกมเปิด (แบบ launcher ทั่วไป)
  }else{
    toast('err',r.error);
  }
}

/* ================= ซ่อมไฟล์ ================= */
function repairFiles(){
  if(S.busy){ toast('err','กำลังทำงานอื่นอยู่ รอแป๊บ'); return; }
  if(!S.patchManifest){ toast('err','ไม่มีแหล่งดาวน์โหลด — เซิร์ฟต้องมี data/launcher_patch.json (zip_url)'); return; }
  setBusy(true,'🔧 กำลังซ่อมไฟล์…');
  window.launcher.patchGame({...S.patchManifest, version:S.patchManifest.version}).then(r=>{
    setBusy(false);
    if(r.ok){ toast('ok','ซ่อมไฟล์เสร็จ — ตรวจ SHA256 ครบ ✅'); }
    else toast('err','ซ่อมไม่สำเร็จ: '+r.error);
  });
}

/* ================= ตั้งค่า ================= */
async function openSettings(){
  $('setAddr').value=S.server;
  $('setAutoPatch').checked=S.autoPatch;
  openModal('ovSettings');
}
async function saveSettings(){
  const addr=$('setAddr').value.trim();
  if(!/^[\w.\-]+(:\d+)?$/.test(addr)){ toast('err','รูปแบบ ip:port ไม่ถูกต้อง'); return; }
  S.server=addr;
  S.autoPatch=$('setAutoPatch').checked;
  await window.launcher.saveSettings({server:S.server, autoPatch:S.autoPatch});
  renderStatus();
  closeModal('ovSettings');
  toast('ok','บันทึกการตั้งค่าแล้ว — เซิร์ฟ: '+S.server);
  RefreshNewsAsync(); RefreshStatusAsync();
}
